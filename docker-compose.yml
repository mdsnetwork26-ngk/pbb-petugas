services:
  pbb-petugas:
    build: .
    container_name: pbb-petugas
    restart: unless-stopped
    # pakai jaringan bawaan Docker: server CasaOS yang sudah banyak aplikasi
    # sering kehabisan kolam IP untuk network compose baru
    # ("could not find an available, non-overlapping IPv4 address pool")
    network_mode: bridge
    ports:
      - "8088:8088"          # kiri = port di server (ubah bila bentrok), kanan = port dalam kontainer
    volumes:
      - ./data:/app/data     # database & cadangan tersimpan di host, aman saat kontainer dibangun ulang
    environment:
      - TZ=Asia/Jakarta
