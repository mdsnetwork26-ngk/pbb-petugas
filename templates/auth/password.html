{% extends "base.html" %}
{% block judul %}Ganti Password{% endblock %}
{% block isi %}
<div class="card" style="max-width:440px;margin:1.5rem auto">
  <h1>Ganti password</h1>
  <p class="help">Akun: <b>{{ u.username }}</b> · {{ 'Admin' if u.role=='admin' else 'Petugas' }}</p>
  <form method="post" action="{{ url_for('auth.ganti_password') }}">
    <input type="hidden" name="_csrf" value="{{ csrf_token }}">
    <div style="margin-bottom:.5rem"><label class="lbl">Password lama</label>
      <input type="password" name="lama" autocomplete="current-password" required></div>
    <div style="margin-bottom:.5rem"><label class="lbl">Password baru</label>
      <input type="password" name="baru" autocomplete="new-password" required minlength="6"></div>
    <div style="margin-bottom:.8rem"><label class="lbl">Ulangi password baru</label>
      <input type="password" name="baru2" autocomplete="new-password" required minlength="6"></div>
    <button class="btn" type="submit">Simpan</button>
    <a class="btn2" href="{{ url_for('app.dashboard') }}">Batal</a>
  </form>
</div>
{% endblock %}
